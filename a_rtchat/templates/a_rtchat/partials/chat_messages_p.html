{% if message and not widget_mode %}
{# Mensaje del usuario — solo en modo página completa; en el widget ya lo muestra el JS #}
<li class="flex justify-end px-2">
    <div class="max-w-[78%] sm:max-w-[65%] group">
        <div class="bg-[#3d3d3d] text-stone-100 rounded-[22px] rounded-br-[6px] px-4 py-2.5 text-sm leading-relaxed shadow-sm break-words">
            <span class="whitespace-pre-wrap">{{ message.body }}</span>
        </div>
        <p class="text-[10px] text-stone-500 text-right mt-1 px-1">Tú</p>
    </div>
</li>
{% endif %}


{% if message2 %}
{# Respuesta de la IA #}
<li class="flex items-end gap-2 px-2">
    <div class="h-7 w-7 rounded-full shrink-0 mb-5 bg-amber-700/30 border border-amber-500/40 flex items-center justify-center text-sm">
        🤖
    </div>
    <div class="max-w-[78%] sm:max-w-[65%]">
        <p class="text-[10px] text-amber-300/70 font-semibold mb-1 px-1">Asistente IA</p>
        <div class="bg-[#2a2a2a] text-stone-100 rounded-[22px] rounded-bl-[6px] px-4 py-2.5 text-sm leading-relaxed shadow-sm border border-amber-900/30 break-words">
            <span class="whitespace-pre-wrap">{{ message2.body }}</span>
        </div>
    </div>
</li>
{% endif %}
